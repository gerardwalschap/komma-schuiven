<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Komma schuiven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
/* Layout: een bord met ruitjespapier; elk cijfer staat in een eigen hokje en de rode komma springt over de lijnen */
:root{
  --bg:#F2F5F9; --paper:#FCFDFE; --grid:#D9E2EF; --line:#C7D2E3; --ink:#1B2540; --muted:#5A6684;
  --comma:#D2372B; --per:#1E5FD0; --pre:#1C8550; --glow:rgba(30,95,208,.13); --panel:#E9EEF6; --on-per:#FFFFFF;
  --f-num:"Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-body:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cell: clamp(20px, min(calc((min(100vw, 1000px) - 48px) / 17), calc((100vh - 290px) / 11)), 58px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1420; --paper:#141C2B; --grid:#223049; --line:#2C3B57; --ink:#E7EDF6; --muted:#97A5BD;
    --comma:#FF6A5A; --per:#74ABFF; --pre:#5CCB8D; --glow:rgba(116,171,255,.17); --panel:#1A2336; --on-per:#0C1424;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1420; --paper:#141C2B; --grid:#223049; --line:#2C3B57; --ink:#E7EDF6; --muted:#97A5BD;
  --comma:#FF6A5A; --per:#74ABFF; --pre:#5CCB8D; --glow:rgba(116,171,255,.17); --panel:#1A2336; --on-per:#0C1424;
  color-scheme:dark;
}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px;
  padding-block:18px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1000px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 20px}
h1{margin:0; font-size:clamp(1.15rem, 2.3vw, 1.55rem); line-height:1.2; text-wrap:balance}
.hint{margin:4px 0 0; color:var(--muted); font-size:.92rem}
.tabs{display:flex; flex-wrap:wrap; gap:6px}
.btn{
  font:inherit; font-size:1rem; padding:.55em 1em; border-radius:8px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); cursor:pointer; line-height:1.2;
}
.btn:hover{border-color:var(--per)}
.btn:focus-visible{outline:3px solid var(--per); outline-offset:2px}
.btn[aria-pressed="true"], .btn.primary{background:var(--per); color:var(--on-per); border-color:transparent}
.btn:disabled{opacity:.4; cursor:default}
.tab small{font-family:var(--f-num); font-size:.9em; opacity:.85}

/* het bord */
.stage{
  position:relative; width:calc(var(--cell) * 17); height:calc(var(--cell) * 11); max-width:100%;
  margin:0 auto; box-sizing:content-box; border:1px solid var(--line); border-radius:6px; overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--cell) var(--cell);
  font-family:var(--f-num); cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
}
.row{
  position:absolute; left:0; top:0; width:100%; height:calc(var(--cell) * var(--h, 1));
  transform:translateY(calc(var(--cell) * var(--y, 0))); opacity:0;
  transition:transform .75s cubic-bezier(.3,.7,.2,1), opacity .45s ease;
}
.row.on{opacity:1}
.row.on.dim{opacity:.28}
.op,.lab,.eq{position:absolute; top:0; height:100%; display:flex; align-items:center; font-size:calc(var(--cell) * .74)}
.op{left:0; width:var(--cell); justify-content:center; color:var(--comma); font-weight:700}
.lab{left:var(--cell); width:calc(var(--cell) * 4); justify-content:flex-end; padding-right:calc(var(--cell) * .12); box-sizing:border-box; font-weight:700}
.eq{left:calc(var(--cell) * 5); width:var(--cell); justify-content:center}
.strip{
  position:absolute; left:calc(var(--cell) * 6); top:0; height:100%; width:calc(var(--cell) * 11);
  transform:translateX(calc(var(--cell) * var(--off, 0)));
  transition:transform .75s cubic-bezier(.3,.7,.2,1);
}
.d{
  position:absolute; top:0; left:calc(var(--cell) * var(--i)); width:var(--cell); height:var(--cell);
  display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell) * .78);
  transition:opacity .45s, color .45s, background-color .45s, transform .45s;
}
.d.int{color:var(--ink)} .d.pre{color:var(--pre); font-weight:700} .d.per{color:var(--per); font-weight:700}
.d.ell{color:var(--muted); font-weight:400}
.d.cut{opacity:0}
.d.gone{opacity:0; transform:translateY(-35%)}
.d.bar::after{content:""; position:absolute; top:9%; left:16%; right:16%; height:max(2px, calc(var(--cell) * .07)); background:var(--per); border-radius:2px}
.d.glow{background:var(--glow)}
.d::before{
  content:""; position:absolute; left:0; right:0; top:50%; height:max(2px, calc(var(--cell) * .075));
  background:var(--comma); transform:scaleX(0); transform-origin:left;
  transition:transform .35s ease; transition-delay:calc(var(--k, 0) * 70ms);
}
.d.strike{color:var(--muted); background:transparent}
.d.strike::before{transform:scaleX(1)}
.comma{
  position:absolute; top:0; height:var(--cell); width:0; left:calc(var(--cell) * var(--cp, 1));
  transition:left .9s cubic-bezier(.55,0,.2,1);
}
.comma.nott{transition:none}
.comma span{
  position:absolute; left:0; bottom:calc(var(--cell) * -.2); transform:translateX(-50%);
  color:var(--comma); font-size:calc(var(--cell) * 1.05); font-weight:700; line-height:1;
}
.arc{
  position:absolute; top:calc(var(--cell) * -.6); height:calc(var(--cell) * .48);
  left:calc(var(--cell) * var(--a1, 0)); width:calc(var(--cell) * (var(--a2, 0) - var(--a1, 0)));
  border:2px dashed var(--comma); border-bottom:none; border-radius:50% 50% 0 0 / 100% 100% 0 0;
  box-sizing:border-box; opacity:0; transition:opacity .4s ease;
}
.arc.on{opacity:1; transition-delay:.45s}
.arc b{
  position:absolute; left:50%; top:calc(var(--cell) * -.27); transform:translateX(-50%);
  font-family:var(--f-body); font-size:calc(var(--cell) * .4); color:var(--comma); white-space:nowrap;
  background:var(--paper); padding:0 .3em; line-height:1.2;
}
.rule{
  position:absolute; left:0; width:calc(var(--cell) * 16); height:max(2px, calc(var(--cell) * .08));
  top:calc(var(--cell) * var(--y, 6) - max(1px, calc(var(--cell) * .04)));
  background:var(--ink); transform:scaleX(0); transform-origin:left; transition:transform .6s ease;
}
.rule.on{transform:scaleX(1)}
.strip.frac{display:flex; align-items:center}
.fr{
  display:inline-flex; flex-direction:column; padding:0 calc(var(--cell) * .2);
  background-image:linear-gradient(var(--ink), var(--ink)); background-repeat:no-repeat;
  background-size:100% max(2px, calc(var(--cell) * .07)); background-position:0 50%;
}
.fr > span{display:flex; justify-content:center}
.c{width:var(--cell); height:var(--cell); display:inline-flex; align-items:center; justify-content:center; font-size:calc(var(--cell) * .78)}
.mid{width:var(--cell); display:inline-flex; justify-content:center; font-size:calc(var(--cell) * .74)}
.p2{display:inline-flex; align-items:center; opacity:0; transform:translateX(-12px); transition:opacity .5s, transform .5s}
.p2.on{opacity:1; transform:none}
.fr.hl{outline:max(2px, calc(var(--cell) * .07)) solid var(--pre); outline-offset:calc(var(--cell) * .08); border-radius:6px; color:var(--pre); font-weight:700}
.stage.instant *, .stage.instant *::before, .stage.instant *::after{transition:none !important}

/* uitleg en bediening */
.cap{
  background:var(--panel); border-radius:8px; padding:14px 18px; min-height:3.1em;
  font-size:clamp(1rem, 1.9vw, 1.28rem); line-height:1.45; transition:opacity .25s;
}
.cap.fade{opacity:0}
.cap b.kp{color:var(--per)} .cap b.kq{color:var(--pre)} .cap b.kc{color:var(--comma)}
.cap .num{font-family:var(--f-num); white-space:nowrap}
.ctl{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.dots{display:flex; gap:6px; flex-wrap:wrap; margin-right:auto}
.dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:transparent; padding:0; cursor:pointer}
.dot.done{background:var(--per); border-color:var(--per)}
.dot:focus-visible{outline:3px solid var(--per); outline-offset:2px}
.count{font-variant-numeric:tabular-nums; color:var(--muted); min-width:5.5em; text-align:right}
@media (prefers-reduced-motion: reduce){
  .row,.strip,.d,.d::before,.comma,.arc,.rule,.p2,.cap{transition-duration:.01s !important; transition-delay:0s !important}
}
@media (max-width:560px){ .ctl .btn{padding:.5em .8em} .count{min-width:auto} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Repeterend decimaal getal omzetten naar een breuk</h1>
      <p class="hint">Tik op het bord of gebruik de pijltjestoetsen om verder te gaan.</p>
    </div>
    <div class="tabs" role="group" aria-label="Kies een voorbeeld">
      <button class="btn tab" id="tab-a" data-ex="a" aria-pressed="true">Gemengd <small>2,1666…</small></button>
      <button class="btn tab" id="tab-b" data-ex="b" aria-pressed="false">Zuiver <small>0,3636…</small></button>
    </div>
  </header>

  <div class="stage" id="stage" role="img" aria-label="Animatie van de omzetting"></div>

  <div class="cap" id="cap" aria-live="polite"></div>

  <div class="ctl">
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button class="btn" id="replay" title="Speel deze stap opnieuw af">Opnieuw</button>
    <button class="btn" id="prev">Vorige</button>
    <button class="btn primary" id="next">Volgende</button>
    <button class="btn" id="full" title="Volledig scherm">Volledig scherm</button>
  </div>
</div>

<script>
(function(){
  const DEF = {show:0, y:0, off:0, comma:null, len:0, op:'', dim:0, bar:0, tail:'', hidden:[], arc:null, p2:0};

  const EX = {
    a: {
      bar:[2,2],
      rows:{
        x:{lab:'x', digits:'21666666', role:i => i===0?'int':i===1?'pre':'per'},
        r10:{lab:'10x', digits:'21666666', role:i => i===0?'int':i===1?'pre':'per'},
        r100:{lab:'100x', digits:'21666666', role:i => i===0?'int':i===1?'pre':'per'},
        res:{lab:'90x', digits:'195', role:() => 'int', plain:1},
        frac:{lab:'x', frac:['195','90','13','6']}
      },
      steps:[
        {cap:'We noemen het repeterend decimaal getal <b>x</b>: <span class="num">x = 2,1666…</span>',
         rows:{x:{show:1, y:1, comma:1, len:8}}},
        {cap:'De <b class="kp">periode</b> is 6: dat cijfer blijft zich herhalen. Tussen de komma en de periode staat nog het cijfer <b class="kq">1</b>.',
         rows:{x:{bar:1}}},
        {cap:'Vermenigvuldig met 10. De <b class="kc">komma</b> schuift 1 plaats naar rechts en staat nu vlak <b>vóór</b> de periode.',
         rows:{r10:{show:1, y:3, comma:{from:1, to:2}, len:8, arc:{from:1, to:2, label:'· 10'}}}},
        {cap:'Vermenigvuldig met 100. De <b class="kc">komma</b> schuift 2 plaatsen naar rechts en staat nu <b>na</b> één volledige periode.',
         rows:{r10:{arc:null}, r100:{show:1, y:5, comma:{from:1, to:3}, len:8, arc:{from:1, to:3, label:'· 100'}}}},
        {cap:'Zet 100x en 10x onder elkaar, komma onder komma. Na de komma staan in beide getallen precies dezelfde cijfers: <span class="num">666…</span>',
         rows:{x:{dim:1, bar:0}, r100:{y:4, arc:null, tail:'glow'}, r10:{y:5, off:1, len:7, op:'−', tail:'glow'}}},
        {cap:'Trek af. De oneindige staarten vallen tegen elkaar weg: <span class="num">100x − 10x = 90x</span> en <span class="num">216 − 21 = 195</span>.',
         rows:{r100:{tail:'strike'}, r10:{tail:'strike'}, res:{show:1, y:6, len:3}}, rule:6},
        {cap:'Deel beide leden door 90.',
         rows:{frac:{show:1, y:8}}},
        {cap:'Vereenvoudig: deel teller en noemer door 15. Controle: <span class="num">13 : 6 = 2,1666…</span>',
         rows:{frac:{p2:1}}}
      ]
    },
    b: {
      bar:[1,2],
      rows:{
        x:{lab:'x', digits:'0363636363', role:i => i===0?'int':'per'},
        r100:{lab:'100x', digits:'0363636363', role:i => i===0?'int':'per'},
        res:{lab:'99x', digits:'36', role:() => 'int', plain:1},
        frac:{lab:'x', frac:['36','99','4','11']}
      },
      steps:[
        {cap:'We noemen het repeterend decimaal getal <b>x</b>: <span class="num">x = 0,3636…</span>',
         rows:{x:{show:1, y:1, comma:1, len:9}}},
        {cap:'De <b class="kp">periode</b> is 36. De <b class="kc">komma</b> staat hier al vlak vóór de periode, dus die eerste verschuiving is niet nodig.',
         rows:{x:{bar:1}}},
        {cap:'Vermenigvuldig met 100. De <b class="kc">komma</b> schuift 2 plaatsen naar rechts, tot <b>na</b> één volledige periode. De 0 vooraan valt weg.',
         rows:{r100:{show:1, y:3, comma:{from:1, to:3}, len:9, arc:{from:1, to:3, label:'· 100'}, hideAfter:[0]}}},
        {cap:'Zet 100x en x onder elkaar, komma onder komma. Na de komma staan in beide getallen precies dezelfde cijfers: <span class="num">3636…</span>',
         rows:{r100:{y:4, arc:null, tail:'glow'}, x:{y:5, off:2, len:7, op:'−', tail:'glow', bar:0}}},
        {cap:'Trek af. De oneindige staarten vallen tegen elkaar weg: <span class="num">100x − x = 99x</span> en <span class="num">36 − 0 = 36</span>.',
         rows:{r100:{tail:'strike'}, x:{tail:'strike'}, res:{show:1, y:6, off:1, len:2}}, rule:6},
        {cap:'Deel beide leden door 99.',
         rows:{frac:{show:1, y:8}}},
        {cap:'Vereenvoudig: deel teller en noemer door 9. Controle: <span class="num">4 : 11 = 0,3636…</span>',
         rows:{frac:{p2:1}}}
      ]
    }
  };

  const stage = document.getElementById('stage');
  const cap = document.getElementById('cap');
  const dots = document.getElementById('dots');
  const count = document.getElementById('count');
  const prevB = document.getElementById('prev');
  const nextB = document.getElementById('next');

  let exKey = 'a', ex, states, idx = 0, els = {}, ruleEl, timers = [];

  function computeStates(e){
    let st = {rows:{}, rule:null};
    for (const id in e.rows) st.rows[id] = Object.assign({}, DEF, {hidden:[]});
    const out = [];
    e.steps.forEach(p => {
      const n = {rows:{}, rule:st.rule};
      for (const id in st.rows) n.rows[id] = Object.assign({}, st.rows[id], {hidden:st.rows[id].hidden.slice()});
      for (const id in (p.rows || {})) {
        const r = n.rows[id], patch = p.rows[id];
        for (const k in patch) {
          const v = patch[k];
          if (k === 'comma' && v && typeof v === 'object') r.comma = v.to;
          else if (k === 'hideAfter') r.hidden = r.hidden.concat(v);
          else r[k] = v;
        }
      }
      if ('rule' in p) n.rule = p.rule;
      out.push(n);
      st = n;
    });
    return out;
  }

  const cells = s => s.split('').map(ch => '<span class="c">' + ch + '</span>').join('');
  const fr = (n, d, cls) => '<span class="fr ' + (cls || '') + '"><span>' + cells(n) + '</span><span>' + cells(d) + '</span></span>';

  function build(){
    ex = EX[exKey];
    states = computeStates(ex);
    stage.innerHTML = '';
    els = {};
    for (const id in ex.rows) {
      const spec = ex.rows[id];
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="op"></span><span class="lab"></span><span class="eq">=</span>';
      row.querySelector('.lab').textContent = spec.lab;
      const strip = document.createElement('div');
      strip.className = 'strip';
      const o = {row, strip, digits:[], spec};
      if (spec.frac) {
        row.style.setProperty('--h', 2);
        strip.classList.add('frac');
        const f = spec.frac;
        strip.innerHTML = fr(f[0], f[1]) + '<span class="p2"><span class="mid">=</span>' + fr(f[2], f[3], 'hl') + '</span>';
        o.p2 = strip.querySelector('.p2');
      } else {
        spec.digits.split('').forEach((ch, i) => {
          const d = document.createElement('span');
          d.className = 'd ' + spec.role(i);
          d.style.setProperty('--i', i);
          d.textContent = ch;
          strip.appendChild(d);
          o.digits.push(d);
        });
        if (!spec.plain) {
          o.ell = document.createElement('span');
          o.ell.className = 'd ell';
          o.ell.textContent = '…';
          strip.appendChild(o.ell);
          o.comma = document.createElement('span');
          o.comma.className = 'comma';
          o.comma.innerHTML = '<span>,</span>';
          strip.appendChild(o.comma);
          o.arc = document.createElement('span');
          o.arc.className = 'arc';
          o.arc.innerHTML = '<b></b>';
          strip.appendChild(o.arc);
        }
      }
      row.appendChild(strip);
      stage.appendChild(row);
      els[id] = o;
    }
    ruleEl = document.createElement('div');
    ruleEl.className = 'rule';
    stage.appendChild(ruleEl);

    dots.innerHTML = '';
    ex.steps.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'dot';
      b.setAttribute('aria-label', 'Ga naar stap ' + (i + 1));
      b.addEventListener('click', ev => { ev.stopPropagation(); goTo(i); });
      dots.appendChild(b);
    });
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.ex === exKey)));
  }

  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  function renderRow(id, r, patch){
    const o = els[id];
    o.row.classList.toggle('on', !!r.show);
    o.row.classList.toggle('dim', !!r.dim);
    o.row.style.setProperty('--y', r.y);
    o.row.querySelector('.op').textContent = r.op || '';
    if (o.p2) { o.p2.classList.toggle('on', !!r.p2); return; }
    o.strip.style.setProperty('--off', r.off);

    const bar = ex.bar;
    const animHide = patch && patch.hideAfter ? patch.hideAfter : [];
    o.digits.forEach((d, i) => {
      const inTail = r.comma != null && i >= r.comma && i < r.len;
      d.classList.toggle('cut', i >= r.len);
      d.classList.toggle('gone', r.hidden.includes(i) && !animHide.includes(i));
      d.classList.toggle('bar', !!r.bar && i >= bar[0] && i <= bar[1]);
      d.classList.toggle('glow', inTail && r.tail === 'glow');
      d.classList.toggle('strike', inTail && r.tail === 'strike');
      d.style.setProperty('--k', inTail ? i - r.comma : 0);
    });
    if (animHide.length) later(() => animHide.forEach(i => o.digits[i].classList.add('gone')), 1500);

    if (o.ell) {
      o.ell.style.setProperty('--i', r.len);
      o.ell.classList.toggle('glow', r.tail === 'glow');
      o.ell.classList.toggle('strike', r.tail === 'strike');
      o.ell.style.setProperty('--k', r.comma != null ? r.len - r.comma : 0);
    }
    if (o.comma) {
      o.comma.hidden = r.comma == null;
      if (patch && patch.comma && typeof patch.comma === 'object') {
        const c = patch.comma;
        o.comma.classList.add('nott');
        o.comma.style.setProperty('--cp', c.from);
        void o.comma.offsetWidth;
        later(() => { o.comma.classList.remove('nott'); o.comma.style.setProperty('--cp', c.to); }, 600);
      } else if (r.comma != null) {
        o.comma.style.setProperty('--cp', r.comma);
      }
    }
    if (o.arc) {
      if (r.arc) {
        o.arc.style.setProperty('--a1', r.arc.from);
        o.arc.style.setProperty('--a2', r.arc.to);
        o.arc.querySelector('b').textContent = r.arc.label;
      }
      o.arc.classList.toggle('on', !!r.arc);
    }
  }

  function apply(i, anim){
    timers.forEach(clearTimeout); timers = [];
    idx = i;
    const st = states[i], p = ex.steps[i];
    if (!anim) stage.classList.add('instant');
    for (const id in st.rows) renderRow(id, st.rows[id], anim ? (p.rows || {})[id] : null);
    ruleEl.classList.toggle('on', st.rule != null);
    if (st.rule != null) ruleEl.style.setProperty('--y', st.rule);
    if (!anim) { void stage.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant'))); }

    cap.classList.add('fade');
    later(() => { cap.innerHTML = p.cap; cap.classList.remove('fade'); }, anim ? 180 : 0);
    if (!anim) { cap.innerHTML = p.cap; cap.classList.remove('fade'); }

    [...dots.children].forEach((d, k) => { d.classList.toggle('done', k <= i); d.setAttribute('aria-current', k === i ? 'step' : 'false'); });
    count.textContent = 'Stap ' + (i + 1) + ' / ' + ex.steps.length;
    prevB.disabled = i === 0;
    nextB.textContent = i === ex.steps.length - 1 ? 'Opnieuw beginnen' : 'Volgende';
  }

  function goTo(i){
    if (i === idx + 1) apply(i, true);
    else apply(i, false);
  }
  function next(){
    if (idx < ex.steps.length - 1) apply(idx + 1, true);
    else { apply(0, false); }
  }
  function prev(){ if (idx > 0) apply(idx - 1, false); }
  function replay(){
    if (idx === 0) { apply(0, false); return; }
    const i = idx;
    apply(i - 1, false);
    setTimeout(() => apply(i, true), 120);
  }
  function setEx(k){
    exKey = k; build(); idx = 0;
    for (const id in els) { els[id].row.classList.remove('on'); }
    requestAnimationFrame(() => apply(0, true));
  }

  stage.addEventListener('click', next);
  nextB.addEventListener('click', next);
  prevB.addEventListener('click', prev);
  document.getElementById('replay').addEventListener('click', replay);
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setEx(t.dataset.ex)));
  document.getElementById('full').addEventListener('click', () => {
    try {
      const el = document.documentElement;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    const onBtn = e.target && e.target.tagName === 'BUTTON';
    if (['ArrowRight', 'PageDown', 'ArrowDown'].includes(e.key) || (!onBtn && (e.key === ' ' || e.key === 'Enter'))) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key)) { e.preventDefault(); prev(); }
  });

  build();
  apply(0, true);
})();
</script>
</body>
</html>
